# The whole CI history of every repository, not just its last run.
#
# =============================================================================
# THIS JOB IS INFORMATIONAL. IT EXITS 0 ON EVERY FINDING, ALWAYS.
#
# It surveys 260 workflows across 35 repositories and it will always find reds - that is
# the point of it. A survey that exits non-zero when it finds what it went looking for is
# misrepresenting its own role, and in GitHub Actions it also mails the actor every night
# until the mail is filtered and the report stops being read.
#
# The findings are in the artifact and in docs/boards/ci-history.md. If you are about to
# "fix" this into a gate: don't. The gates already exist in the repositories that own the
# work, and they already fail loudly when they should.
# =============================================================================
#
# WHY IT EXISTS ALONGSIDE audit_estate.py
#
# That script answers "what is red right now?" from the LATEST run per workflow. It cannot
# tell a regression from a workflow that has never worked in its life, because both present
# as a failing last run. The difference decides whether you are fixing something or
# finishing it, and on the first cloud run it separated 45 never-green workflows from the
# reds that actually regressed.
#
# It also measures that reader's own blind spot. audit_estate.py files `success` as green,
# `failure`/`timed_out`/`startup_failure` as red, and everything else as neither - so
# `cancelled` runs are reported as nothing at all. The first run counted 300 of them.
#
# WHY THE CLOUD
#
# Roughly 400 API calls against 35 repositories, entirely deterministic, no local state.
# It costs this laptop two minutes of wall clock and a chunk of its hourly API budget every
# time someone wants the answer. On a public repository it costs the cloud nothing.
#
# ON THE TOKEN. GITHUB_TOKEN is scoped to this repository. Cross-repo reads of PUBLIC
# Actions history normally succeed with it; if any repository comes back 403 or 404 the
# script records it under `unreadable` and carries on, so a permission limit is reported as
# a fact about the token rather than as a defect of the repository. If that list is ever
# non-empty, the fix is a read-only PAT in a secret named GH_READ_TOKEN - not a change here.

name: 202609032345 CI history across the estate

on:
  workflow_dispatch:
  # ONE nightly informational run, staggered off the crawl so the two do not contend.
  schedule:
    - cron: '11 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/ci_history_mine.py'
      - '.github/workflows/202609032345-ci-history-mine.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: ci-history-mine
  cancel-in-progress: true

jobs:
  mine:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Mine every workflow's whole history
        env:
          # A read-only PAT if one has been provided; otherwise the job's own token.
          GH_TOKEN: ${{ secrets.GH_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          python scripts/ci_history_mine.py \
            --owner Ventusltd \
            --max-runs 200 \
            --out ci-history.json \
            --board docs/boards/ci-history.md
          echo "miner exit: $?"

      - name: Upload the survey
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-history
          path: ci-history.json
          if-no-files-found: warn
          retention-days: 90

      # Staged BY EXPLICIT PATH. Other lanes write to this repository and `git add -A` in a
      # job would sweep up their work in progress.
      - name: Commit the board if it changed
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/boards/ci-history.md
          if git diff --cached --quiet; then
            echo "the board is unchanged; nothing to commit"
            exit 0
          fi
          {
            printf '%s\n\n' 'docs/boards/ci-history.md: every workflow that has never been green'
            printf '%s\n' 'Written by 202609032345-ci-history-mine.yml. Informational: the survey exits 0'
            printf '%s\n' 'on every finding, so a red is recorded here rather than mailed to anyone.'
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git pull --rebase --quiet || true
          git push || echo "push declined; the findings are in the artifact"
