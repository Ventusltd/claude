# The byte questions, asked where the bytes are true.
#
# =============================================================================
# THIS JOB IS INFORMATIONAL. IT EXITS 0 ON EVERY FINDING, ALWAYS.
#
# The gate that must block already exists: gridatlas's 202608312212-cartridge-proof.yml
# fails loudly on CRLF, on a bad composition and on a cartridge over its ceiling, and
# nothing here touches it. This job measures the same surface across the whole estate and
# writes the numbers down. A survey that exits non-zero would both mail the actor nightly
# and claim an authority it does not have over repositories it does not own.
#
# Findings are in the artifact and in docs/boards/clean-clone-bytes.md. If you are about to
# "fix" this into a gate: don't - the gate is elsewhere and it is already red when it needs
# to be.
# =============================================================================
#
# WHY THIS CANNOT BE ANSWERED ON THE LAPTOP
#
# `git status` compares THROUGH .gitattributes normalisation. It reports a tree clean while
# the disk holds CRLF and the blob holds LF, and fifteen of eighteen repositories in this
# estate are in exactly that state. So every measurement that depends on file bytes - a
# digest, a checksum manifest, a character ceiling - reads a different number on a Windows
# working tree than it reads anywhere the artefact is served. That is not a rounding error;
# it is a different file.
#
# A runner checks out from the blob. It is the cheapest clean clone available, and it can
# hold several repositories side by side. Hence: the cloud.
#
# WHAT IT SETTLES
#
# Three different ceilings are enforced in this estate and they are three different numbers:
#
#     368640  characters  asserted by the cartridge proof (0.9 x 409600)
#     400000  bytes       gated by tools/scope/loop.mjs lint
#     409600  bytes       the composer boundary, reported but not enforced
#
# and characters are not bytes - the proof measures UTF-16 code units, the lint measures
# statSync().size, and cartridges contain non-ASCII. The survey reports a cartridge on all
# three gauges with the divergence named, so nobody has to remember which one they were
# reading. A prior version of that check asserted against one number and REPORTED against
# another, and printed 40,995 characters of headroom when the true figure was 35.

name: 202609032350 Clean-clone byte survey

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/clean_clone_byte_survey.py'
      - '.github/workflows/202609032350-clean-clone-byte-survey.yml'
  # ONE nightly informational run, staggered clear of the other two.
  schedule:
    - cron: '29 4 * * *'

permissions:
  contents: write

concurrency:
  group: clean-clone-byte-survey
  cancel-in-progress: true

jobs:
  survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Fresh clones, one per repository, into a directory this repository does not track.
      # Shallow, because line endings and file bytes are properties of the checked-out tree
      # and need no history. gridatlas is cloned to full depth of one but with its blobs,
      # because the cartridge measurement reads the files themselves.
      - name: Clone the estate clean
        env:
          GH_TOKEN: ${{ secrets.GH_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/clones
          for r in gridatlas globalgrid2050 pipelinenews cvaa spiders companies \
                   data-gridatlas data-grid-gb data-centres-gb data-interconnectors \
                   data-gb-electricity gb-electricity-ui grid-distance-maths \
                   chatgpt-audits codex-chatgpt gemini claude \
                   data-federation-map-for-globalgrid2050-all-repos; do
            git clone --quiet --depth 1 "https://github.com/Ventusltd/$r.git" "/tmp/clones/$r" \
              && echo "cloned $r" \
              || echo "could not clone $r; it will be reported as absent rather than skipped"
          done
          ls /tmp/clones

      - name: Measure
        run: |
          set -uo pipefail
          python scripts/clean_clone_byte_survey.py \
            --root /tmp/clones \
            --out clean-clone-bytes.json \
            --board docs/boards/clean-clone-bytes.md
          echo "survey exit: $?"

      - name: Upload the survey
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clean-clone-bytes
          path: clean-clone-bytes.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit the board if it changed
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/boards/clean-clone-bytes.md
          if git diff --cached --quiet; then
            echo "the board is unchanged; nothing to commit"
            exit 0
          fi
          {
            printf '%s\n\n' 'docs/boards/clean-clone-bytes.md: line endings and cartridge ceilings on a clean clone'
            printf '%s\n' 'Written by 202609032350-clean-clone-byte-survey.yml. Informational: exits 0 on'
            printf '%s\n' 'every finding. The gate that blocks is gridatlas 202608312212-cartridge-proof.yml.'
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git pull --rebase --quiet || true
          git push || echo "push declined; the findings are in the artifact"
